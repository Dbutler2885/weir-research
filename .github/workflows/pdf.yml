name: Local PDF conversion

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/*docling*"
      - "scripts/convert_pdf.py"
      - "tests/python/**"
      - ".github/workflows/pdf.yml"

permissions:
  contents: read

jobs:
  convert:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm run setup:pdf
      - run: npm run test:pdf
