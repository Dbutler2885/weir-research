[project]
name = "research-workspace-documents"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "docling>=2,<3",
  "onnxruntime>=1.24,<2",
  "ocrmac>=1,<2; sys_platform == 'darwin'",
]

[dependency-groups]
dev = ["reportlab>=4,<5"]

[tool.uv]
package = false

# CPU wheels avoid installing CUDA libraries on machines without NVIDIA GPUs.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
